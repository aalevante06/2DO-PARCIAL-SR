# Configuracion extractada del backup real FortiOS 7.0.9; datos sensibles omitidos.
# NO ES BACKUP RESTAURABLE. No contiene PSK ni contrasenas.

config system interface
    edit "port1"
        set vdom "root"
        set mode dhcp
        set allowaccess ping https ssh http fgfm
        set type physical
        set snmp-index 1
    next
    edit "port2"
        set vdom "root"
        set ip 10.21.75.1 255.255.255.0
        set allowaccess ping
        set type physical
        set alias "LAN-REMOTA-2174"
        set snmp-index 2
    next
    edit "VPN-CISCO-2174"
        set vdom "root"
        set type tunnel
        set snmp-index 15
        set interface "port1"
    next
end

config firewall address
    edit "VPN-CISCO-2174_local_subnet_1"
        set allow-routing enable
        set subnet 10.21.75.0 255.255.255.0
    next
    edit "VPN-CISCO-2174_remote_subnet_1"
        set allow-routing enable
        set subnet 10.21.74.0 255.255.255.0
    next
end

config firewall addrgrp
    edit "VPN-CISCO-2174_local"
        set member "VPN-CISCO-2174_local_subnet_1"
        set comment "VPN: VPN-CISCO-2174 (Created by VPN wizard)"
        set allow-routing enable
    next
    edit "VPN-CISCO-2174_remote"
        set member "VPN-CISCO-2174_remote_subnet_1"
        set comment "VPN: VPN-CISCO-2174 (Created by VPN wizard)"
        set allow-routing enable
    next
end

config vpn ipsec phase1-interface
    edit "VPN-CISCO-2174"
        set interface "port1"
        set keylife 28800
        set peertype any
        set net-device disable
        set proposal des-sha1
        set comments "VPN: VPN-CISCO-2174 (Created by VPN wizard)"
        set dhgrp 14
        set remote-gw 10.21.76.1
    next
end

config vpn ipsec phase2-interface
    edit "VPN-CISCO-2174"
        set phase1name "VPN-CISCO-2174"
        set proposal des-sha1
        set dhgrp 14
        set comments "VPN: VPN-CISCO-2174 (Created by VPN wizard)"
        set src-addr-type name
        set dst-addr-type name
        set keylifeseconds 3600
        set src-name "VPN-CISCO-2174_local"
        set dst-name "VPN-CISCO-2174_remote"
    next
end

config firewall policy
    edit 1
        set name "vpn_VPN-CISCO-2174_local_0"
        set srcintf "port2"
        set dstintf "VPN-CISCO-2174"
        set action accept
        set srcaddr "VPN-CISCO-2174_local"
        set dstaddr "VPN-CISCO-2174_remote"
        set schedule "always"
        set service "ALL"
        set comments "VPN: VPN-CISCO-2174 (Created by VPN wizard)"
    next
    edit 2
        set name "vpn_VPN-CISCO-2174_remote_0"
        set srcintf "VPN-CISCO-2174"
        set dstintf "port2"
        set action accept
        set srcaddr "VPN-CISCO-2174_remote"
        set dstaddr "VPN-CISCO-2174_local"
        set schedule "always"
        set service "ALL"
        set comments "VPN: VPN-CISCO-2174 (Created by VPN wizard)"
    next
end

config router static
    edit 1
        set device "VPN-CISCO-2174"
        set comment "VPN: VPN-CISCO-2174 (Created by VPN wizard)"
        set dstaddr "VPN-CISCO-2174_remote"
    next
    edit 2
        set distance 254
        set comment "VPN: VPN-CISCO-2174 (Created by VPN wizard)"
        set blackhole enable
        set dstaddr "VPN-CISCO-2174_remote"
    next
    edit 100
        set dst 10.21.74.3 255.255.255.255
        set gateway 10.21.76.1
        set device "port1"
    next
end
